<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ledger</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the theme before Angular starts, so there is no light flash in dark mode.
      (function () {
        try {
          var mode = localStorage.getItem('ledger.theme') || 'system';
          var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
