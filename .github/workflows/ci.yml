name: CI

on:
  pull_request:
  workflow_call: # the deploy workflow runs it first on main

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + unit, architecture and integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Ledger.slnx
      # Integration tests start PostgreSQL, RabbitMQ and Keycloak with Testcontainers (Docker is on the runner).
      - run: dotnet test Ledger.slnx --no-build

  web:
    name: Web (unit tests + EN/ES build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
