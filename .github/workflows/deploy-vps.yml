name: Deploy (VPS)

# main -> tests -> images (amd64) to GitHub Container Registry -> over SSH: migrate and restart (deploy/vps/deploy.sh).
# Repository secrets: VPS_HOST, VPS_SSH_KEY (private key of the "deploy" user), VPS_KNOWN_HOSTS (ssh-keyscan of the host).
# Repository variable: VPS_DOMAIN (the app is at https://ledger.<VPS_DOMAIN>). Documentation §19.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ledger

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: .
            file: src/Ledger.Api/Dockerfile
            target: production
          - name: migrator
            context: .
            file: src/Ledger.Migrator/Dockerfile
          - name: web
            context: clients/web
            file: clients/web/Dockerfile
          - name: keycloak
            context: infra/keycloak-prod
            file: infra/keycloak-prod/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          provenance: false
          # Links the package to this repository, so the deploy can pull it with the job's token.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
          cache-from: type=gha,scope=vps-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=vps-${{ matrix.name }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy the stack files
        env:
          TARGET: deploy@${{ secrets.VPS_HOST }}
        run: |
          ssh "$TARGET" 'mkdir -p /opt/ledger/initdb'
          scp deploy/vps/docker-compose.yml deploy/vps/Caddyfile deploy/vps/backup.sh deploy/vps/deploy.sh deploy/vps/.env.example "$TARGET:/opt/ledger/"
          scp deploy/vps/initdb/* "$TARGET:/opt/ledger/initdb/"
          ssh "$TARGET" 'chmod +x /opt/ledger/backup.sh /opt/ledger/deploy.sh'

      - name: Pull, migrate and restart
        env:
          TARGET: deploy@${{ secrets.VPS_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The token goes through stdin, never on a command line.
          printf '%s' "$GHCR_TOKEN" | ssh "$TARGET" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          status=0
          ssh "$TARGET" "/opt/ledger/deploy.sh '${{ github.sha }}'" || status=$?
          ssh "$TARGET" 'docker logout ghcr.io' || true
          exit $status

      - name: Smoke check
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS "https://ledger.${{ vars.VPS_DOMAIN }}/health"; then echo; exit 0; fi
            sleep 6
          done
          echo "::error::https://ledger.${{ vars.VPS_DOMAIN }}/health did not answer 200"
          exit 1
